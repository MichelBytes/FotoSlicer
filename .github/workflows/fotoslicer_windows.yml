name: FotoSlicer Windows build

# Builds the Windows x64 installer and portable zip for the fotoslicer branch. The finished
# files are attached to the workflow run (Actions tab > the run > Artifacts).
on:
  push:
    branches:
      - fotoslicer
  workflow_dispatch:

concurrency:
  group: fotoslicer-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Build FotoSlicer for Windows x64
    permissions:
      actions: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
    secrets: inherit

  # The installer goes to the download page by hand (FotoSlicer publish test build), once the
  # screenshot shows the build is ready.
  screenshot:
    name: Screenshot
    needs: build_windows
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/fotoslicer_screenshot.yml
    with:
      same_run: true
