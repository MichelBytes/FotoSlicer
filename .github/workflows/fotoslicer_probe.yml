name: FotoSlicer search probe
on:
  push:
    branches: [fotoslicer-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: "*.png" }
